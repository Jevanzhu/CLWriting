# Electron 桌面应用构建（#electron · mac dmg + win nsis——win 腿阶段 21 J0 启用，2026-08-28；linux 仍暂缓）
# 手动触发 或 tag v* 触发；产物 macOS→dmg、Windows→exe（x64 单文件 NSIS，首版 unsigned 见 D4）
name: Desktop Build
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# R72-13（二十轮 H-4）：最小权限 + 并发组（与 ci.yml 同口径；tag 发布腿不做进行中
# 取消——出包中途杀跑只留半成品工件无益；upload-artifact 走独立 token 不受收窄影响）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # M-3（第十一轮）：20→30——tag 门补 typecheck+test 前置步后（发布物验证门），
    # mac 单腿跑全量 vitest + electron-builder 需要更宽的预算
    # N-1（第十二轮）：30→40——tag 门再补 check:packaging + release-smoke（自带一次
    # build:all + playwright），与 ci.yml e2e job 同预算量级
    # J0（阶段 21）：40→50——win 腿 npm ci 与 NSIS 首跑工具链下载（nsis/winCodeSign）
    # 偏慢，windows runner 无历史缓存留余量；mac 腿实测量级不变
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # H-2（二十轮 P2）：未配 arch——macos-latest 为 arm64 runner，产物仅 arm64 DMG；
        # Intel mac 无可用产物。发行架构（+x64 / universal / win/linux 恢复）属发行决策，
        # 暂记档不代拍；需要双 arch 时改 electron-builder.yml mac.target 为
        # [{target: dmg, arch: [arm64, x64]}]（或 universal）并跑一次 tag 门验证。
        # J0（阶段 21，2026-08-28）：加 windows-latest 腿产 exe——e2e/release-smoke/Electron
        # 冒烟按 D5（win 仅 typecheck+build+单测）仍留 mac，win 腿跑门禁步 + build:desktop +
        # exe 上传 + 打包态启动冒烟。H-2 的 mac arch 注记不变（arm64 单腿）。
        os: [macos-latest, windows-latest]
    steps:
      # G406（0918四轮修复批）：第三方 action 全量改 commit SHA 钉版（尾注 # v4 保留主版本
      # 可读性；SHAs 与 ci.yml 同批实取、git ref 与 commit 端点双源核验）——浮动 major
      # tag 指向可被上游移动的供应链面，见 ci.yml 同注。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm # dd-P3（E-P3-2）：npm 缓存（两条 lockfile 入键）
          cache-dependency-path: |
            package-lock.json
            src/studio/web-next/package-lock.json
      - run: npm ci
      # 复评P1：build:all 会 npm --prefix 进 web-next（独立 package.json + lockfile）跑 Vite 构建，
      # 干净 runner 缺此步骤则 build:desktop 必挂（主 CI ci.yml 已有同款步骤）
      - run: npm --prefix src/studio/web-next ci
      # G401（0918四轮修复批）：依赖漏洞扫描门——根包与 web-next 子包各扫一次
      #（--audit-level=high 只拦高危以上）。存量高危已由清链批 024f8726 清零（root 仅余
      # vitest 族 moderate、web-next 归零），观察期收口翻 blocker：新增 high 及以上即红
      #（四轮-G401「连续绿后翻 blocker」兑现）。
      - name: 依赖漏洞扫描（npm audit ≥high，根包）
        run: npm audit --audit-level=high
      - name: 依赖漏洞扫描（npm audit ≥high，web-next 子包）
        run: npm --prefix src/studio/web-next audit --audit-level=high
      # 五轮重评修复批（H103）：观察档到期硬锚——原守本文件 + ci.yml audit 四门与下方
      # G403 win 腿 e2e/release-smoke 双观察档的「连续绿后翻 blocker/连续 3 次绿翻阻断」
      # 承诺；audit 四门已随清链批翻正，本锚现守 G403 双观察档。过期仍挂观察即红
      #（fail-closed 强制复盘：翻正撤 continue-on-error 后本步随锚一并删除，或有意
      # 延期则修订锚日并批注缘由）。
      - name: 观察档到期断言（过期未翻阻断即红）
        shell: bash
        run: |
          EXPIRY=2026-10-31
          TODAY=$(date +%Y-%m-%d)
          if [[ "$TODAY" > "$EXPIRY" ]]; then
            echo "::error::观察档已到期（锚日 ${EXPIRY}）：win 腿 e2e·release-smoke 观察档仍挂 continue-on-error 未翻阻断（audit 四门已翻正不在守面）——先复盘翻正（或修订锚日并批注缘由）再重跑"
            exit 1
          fi
          echo "观察档未到期（${TODAY} ≤ ${EXPIRY}）"
      # R0916-6-P2-3（2026-09-16 全库源码重评五轮修复批）：tag 名 ↔ package.json version
      # 一致性门——工作流以 tags: ['v*'] 触发，此前出包前无任何步骤校验两者一致：打 tag
      # v1.0.0 忘 bump version 时，electron-builder 产物名写旧版本（package.json 的
      # version）且工作流照绿，产物与 tag/Release 名错位无门可拦。node -e 内联比对
      # （仓库 scripts 均走 node，win 兼容；GITHUB_REF_NAME 去前导 v 后严格相等）。
      # workflow_dispatch 腿（ref_type=branch，ref_name 是分支名）不适用此门，显式豁免。
      - name: tag 与 package.json version 一致性门
        if: github.ref_type == 'tag'
        run: node -e "const v=require('./package.json').version;const ref=process.env.GITHUB_REF_NAME||'';const t=ref.replace(/^v/,'');if(v!==t){console.error('[tag-version] 不一致：tag='+ref+' 但 package.json version='+v+'（去前导 v 应为 '+t+'）——bump version 或修正 tag 后重跑');process.exit(1)}console.log('[tag-version] 一致：tag '+ref+' == package.json version '+v)"
      # M-3（第十一轮）：tag 发布门补 typecheck+test 前置——此前 tag v* 直接产 DMG，工作流
      # 内无任何验证步（ci.yml 只监听分支 push），tag 若指未测提交即产出未验证发布物；
      # rc.1 实操是先门禁绿再打 tag（流程弥补），此处把门焊进工作流本体
      - name: 类型检查（tsc --noEmit 零错）
        run: npm run typecheck
      - name: 前端类型检查（vue-tsc）
        run: npm --prefix src/studio/web-next run typecheck
      # R67-3（十五轮）：lint 门焊进 tag 发布工作流（与 ci.yml 同款步骤）——此前 tag 门
      # 门集与分支 CI 不对称，lint 只在本地生效
      - name: lint 门（eslint）
        run: npm run lint
      # R0912-G2-P3-5（2026-09-12 独立重评修复批）：win 腿拆专用步收尾竞态重跑兜底，
      # 同 ci.yml「测试」步的 R0911-G-P1-1d 结构逐行照搬（成因/语义/副作用见彼处注释；
      # desktop.yml 矩阵为 os 双腿无 node 维度——按矩阵腿 if 分流：win 走 pwsh 重跑，
      # 非 win 维持原样单跑。上游根治后与 ci.yml 兜底一并可撤）。
      - name: 单元测试（vitest run）
        if: runner.os != 'Windows'
        run: npm test
      - name: 单元测试（win 腿，R0912-G2-P3-5 收尾竞态重跑一次兜底，同 R0911-G-P1-1d）
        if: runner.os == 'Windows'
        # G402（0918四轮修复批）：pwsh 重跑逻辑抽本地 composite action（.github/actions/
        # win-vitest-retry，ci.yml 同批接线）——两段逐行复制品单源化；语义与日志文案
        # 逐字保持（批次号经 warning-title 传参），重跑兜底语义不变。
        uses: ./.github/actions/win-vitest-retry
        with:
          warning-title: R0912-G2-P3-5
      # N-1（第十二轮）：M-3 修得不完整——tag 门只补了 typecheck+test，check:packaging
      # （打包资源完整性门）与 release-smoke（编译产物真实起服验证）仍只在 ci.yml 分支
      # push 跑；tag 若指 ci.yml 跳过/失败的提交（CC-P1-7 场景），DMG 仍可产出未验发布
      # 形态。此处把两门焊进 tag 工作流本体（与 ci.yml e2e job 同款步骤）
      - name: 打包资源门（check:packaging）
        run: npm run check:packaging
      # P-2（第十四轮）：tag 门与 ci.yml 门集合对齐——counts（README 账实对账）与
      # knowledge（知识层 manifest 校验，check:knowledge 是其唯一自动执行通道）补进
      # 发布工作流；tag 指未经分支 CI 的提交时 DMG 不再携带文档失真/manifest 失配出包
      - name: 计数对账门（check:counts）
        run: npm run check:counts
      - name: 知识层门（check:knowledge）
        run: npm run check:knowledge
      # G404（0918四轮修复批）：tag 发布门补 soak 内存门——此前 soak 只在 ci.yml e2e job
      # 跑（tag 触发不经分支 CI），泄漏回归可随未测提交的 DMG/exe 出包无门可拦；此处焊进
      # 发布工作流本体，blocking（不设 continue-on-error）。取 mac 腿单腿背书（纯 Node
      # 脚本零系统依赖，win 腿亦可跑，但 win 腿预算已被 J0 吃紧不叠加）。断言两段式
      #（G408）：先 soak.ts --plan 提计划数，再真跑比对 OK 行数——计数源与 ci.yml soak
      # 门同源（补段只改 soak.ts PLAN_SEGMENTS 一处）；先例逐字对齐 ci.yml soak 门。
      - name: 有界内存/soak 门（--expose-gc，tag 发布腿）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SOAK_N=$(node --import tsx test/soak/soak.ts --plan | sed -n 's/^plan: \([0-9]\{1,\}\)$/\1/p')
          [ -n "$SOAK_N" ] || { echo "::error::soak --plan 未输出计划数（应含 plan: N 行）——计数提取失败，按 fail-closed 处理"; exit 1; }
          npm run soak | tee /tmp/soak-output.log
          OK_N=$(grep -c '\[soak\] OK' /tmp/soak-output.log || true)
          [ "$OK_N" -eq "$SOAK_N" ] || { echo "::error::soak 门 OK 行数=${OK_N} ≠ 计划段数=${SOAK_N}（段失败/SKIP/退出码非零均不得步绿；计数源 = soak.ts --plan，补段只改 soak.ts PLAN_SEGMENTS）——内存门假绿拦截"; exit 1; }
      # R0912-3（重评-0912-3 #45）：mac 腿补 playwright chromium 缓存——此前仅 ci.yml
      # e2e job（ubuntu）有缓存，mac 腿每次 ~130MB 重下。路径按 macOS 实际缓存位
      #（~/Library/Caches/ms-playwright，非 linux 的 ~/.cache）。
      # 0917清库修复批：键由 hashFiles(lockfile) 改 OS+workflow+playwright 版本写死
      #（1.61.1 对照根 package.json @playwright/test ^1.61.1，升版须同步改）——任意
      # 锁文件改动都会换键致 ~130MB 整包重下，与 playwright 是否升级无关；
      # restore-keys 前缀兜底换版时恢复旧缓存只补差量浏览器。
      # G407（0918四轮修复批）：键内版本改从根 lock 动态提取进 step output（下方 pwver
      # 步；shell: bash 显式——win 默认 pwsh 里 $GITHUB_OUTPUT 不展开（须 $env:GITHUB_OUTPUT），
      # 且 >> 重定向编码历史面不一；0919 复核 H404 勘误：原注「编码不兼容」系成因误写）
      # ——「写死 1.61.1 对照 ^1.61.1、升版须同步改」双真相源销账；键式 pw-<ver>-<os>
      # -<workflow>（workflow 身份保留，两工作流缓存互不串用）；web-next 子包 lock 无
      # @playwright/test，playwright 由根 lock 统一管理（实态已核）。
      - name: 取 playwright 版本（根 lock 单一真相源）
        id: pwver
        shell: bash
        run: echo "v=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"
      - name: 缓存 playwright chromium
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-${{ steps.pwver.outputs.v }}-${{ runner.os }}-${{ github.workflow }}
          restore-keys: |
            pw-${{ runner.os }}-${{ github.workflow }}-
      # G403/G407（0918四轮修复批）：win 腿同款缓存——G403 给 win 腿接 e2e/release-smoke
      # 后每跑重下 chromium ~130MB 同病；路径 ~\AppData\Local\ms-playwright（actions/cache
      # README 明示 Windows 环境变量 %LOCALAPPDATA% 不被展开、荐 ~ 式做 HOME 展开；
      # 键含 runner.os 与 mac 腿互不串用）。
      - name: 缓存 playwright chromium（win 腿）
        if: runner.os == 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: pw-${{ steps.pwver.outputs.v }}-${{ runner.os }}-${{ github.workflow }}
          restore-keys: |
            pw-${{ runner.os }}-${{ github.workflow }}-
      - name: 装 playwright chromium
        # G403：win 腿接 e2e 后双腿同装（chromium 在 win 免系统依赖步，无需 --with-deps）
        run: npx playwright install chromium
      # R69-32（十七轮）：tag 门补常规 e2e（29 spec 前端动线）——此前 tag 门只有
      # release-smoke（2 用例）+ Electron 启动冒烟兜底核心面，前端交互回归可随 DMG
      # 出包；复用上方已装 chromium（test:e2e 自带 build:web 前置）。coverage 阈值门
      # 仍留分支 CI（阈值门管代码演化趋势，非发布物属性，注释记档口径）。
      - name: 常规 e2e（build:web + playwright test）
        if: runner.os == 'macOS'  # G403 后 mac 腿照旧（D5/J0 注记沿革，win 腿见下方观察档步）
        run: npm run test:e2e
      - name: 发布冒烟（release-smoke，build:all + 编译产物起服）
        if: runner.os == 'macOS'  # G403 后 mac 腿照旧（D5/J0 注记沿革，win 腿见下方观察档步）
        run: npm run test:e2e:release
      # G403（0918四轮修复批）：出货平台 Windows 的 e2e/release-smoke CI 覆盖——此前 win
      # 腿只跑门禁步 + build:desktop + 打包态冒烟，test:e2e / test:e2e:release 双零覆盖
      #（D5「e2e 仍 mac」口径未随 win 出货反转）。镜像 mac 腿式样：复用上方已装 chromium；
      # test:e2e 自带 build:web 前置、release-smoke 自带 build:all 前置，零额外环境变量
      #（两链纯 Node + chromium 无 mac 专属面；playwright.config/global-setup 平台中立，
      # global-setup 自带 win32 分支）。timeout 预算核对：job 总额 50min，win 腿现跑段
      #（双 npm ci + 门禁步 + build:desktop + 冒烟）估 ~30min，叠 e2e（build:web + 33
      # spec 串行）+ release-smoke（build:all + 2 用例）≈ +8min，预算内；首跑若触顶再校准
      #（参照 ci.yml e2e job 同链 25min 预算）。
      # 首期 continue-on-error 观察档：win runner 上 e2e 稳定性未知（首次接线，win 腿
      # npm test 收尾竞态族在先），红只留痕不阻断出包；连续 3 次绿后撤标志翻阻断
      #（四轮-G403）。trace 工件本期不接（failure() 在 continue-on-error 步红下不触发，
      # 排障走步日志；翻阻断时随标志撤销一并补）。
      - name: 常规 e2e（win 腿，build:web + playwright test）
        if: runner.os == 'Windows'
        continue-on-error: true # 首期观察档：win runner 上 e2e 稳定性待观察，连续 3 次绿后撤标志翻阻断（四轮-G403）
        run: npm run test:e2e
      - name: 发布冒烟（win 腿，release-smoke，build:all + 编译产物起服）
        if: runner.os == 'Windows'
        continue-on-error: true # 首期观察档：win runner 上 e2e 稳定性待观察，连续 3 次绿后撤标志翻阻断（四轮-G403）
        run: npm run test:e2e:release
      - name: 上传 playwright trace（失败时）
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-trace-desktop
          path: test-results/
          retention-days: 7
      # build:desktop = build:all(tsup+web) + electron-builder（unsigned 首版）。
      # --publish never：electron-builder 26 在 tag 提交上会隐式尝试发 GitHub Release（缺
      # GH_TOKEN 即红，v1.0.0-rc.1 首跑实录）；本工作流产物走下方 upload-artifact，不发布
      - run: npm run build:desktop
      # R0916-6-P3-9（2026-09-16 全库源码重评五轮修复批）：发布产物 sha256 清单——
      # unsigned 分发恰是最需要完整性校验和的一类，此前 artifact 只含 dmg/exe 裸包，
      # 下载方无任何完整性锚。node crypto 内联（跨平台单脚本，mac/win 双腿同跑）对
      # dist-electron 下 *.dmg/*.exe 生成 SHA256SUMS.txt（`<hash>␣␣<filename>` 标准两
      # 空格格式，sha256sum -c 可验），与产物一并上传（下方两腿 artifact path 已并入）。
      # 零产物即红：electron-builder 静默不出包时在此 fail-closed，不上传空壳工件。
      - name: 生成发布产物 SHA256 清单
        run: node -e "const fs=require('fs'),crypto=require('crypto');const dir='dist-electron';const files=fs.readdirSync(dir).filter(f=>f.endsWith('.dmg')||f.endsWith('.exe')).sort();if(files.length===0){console.error('[checksum] dist-electron 下无 .dmg/.exe 产物——electron-builder 出包异常');process.exit(1)}const lines=files.map(f=>crypto.createHash('sha256').update(fs.readFileSync(dir+'/'+f)).digest('hex')+'  '+f);fs.writeFileSync(dir+'/SHA256SUMS.txt',lines.join('\n')+'\n');console.log(lines.join('\n'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'macOS'
        with:
          name: clwriting-desktop-${{ matrix.os }}
          # R72-15（二十轮 H-8）：工件只留 dmg——mac*/ 整目录（.app 解包态）与 dmg 内容
          # 重复、上传体积双倍；Electron 冒烟步用本地 dist-electron 路径，不依赖本工件
          # R0916-6-P3-9：SHA256SUMS.txt 随产物一并上传（生成步见 build:desktop 后）
          path: |
            dist-electron/*.dmg
            dist-electron/SHA256SUMS.txt
          if-no-files-found: error
      # J0：win 腿工件只留 NSIS 单文件 exe（win-unpacked/ 解包态不上传，同 H-8 体积口径；
      # blockmap 等伴生文件不在 *.exe 通配内自然排除）
      # R0916-6-P3-9：SHA256SUMS.txt 随产物一并上传（生成步见 build:desktop 后）
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && runner.os == 'Windows'
        with:
          name: clwriting-desktop-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/SHA256SUMS.txt
          if-no-files-found: error
      # R67-4（十五轮）：Electron 壳真实启动冒烟——release-smoke 只 spawn 编译产物
      # server-main.js（node 进程，不启动 Electron 壳），BrowserWindow/preload/IPC 在
      # 真实 Electron 运行时的行为此前无任何自动化兜底。拉起打包态 .app 二进制，
      # 捕获 [CLW_SMOKE] ready 结构化标记且未触发 renderer-crash 标记即过
      # （放工件上传后：冒烟红仍留 DMG 供排查）。
      # R73-53（二十一轮）：判定改 grep main.ts 直写 stdout 的结构化标记（一行 ASCII）——
      # 原 grep 中文措辞与 main.ts 文案强耦合，文案改写即静默失判（且打包态 log.* 只落
      # JSONL 不进 stdout，原崩溃 grep 实际并不可见）
      # 复审-0914-优化修复批 P3：固定 sleep 25 改轮询启动标记早退（timeout 60 ≥ 原 25s
      # 安全裕度；标记到即走，快机不再白等、慢机上限更宽）。判定语义不弱化：下方
      # 「进程存活 + ready 标记 + 无 renderer-crash」三重判定原样保留——轮询超时（标记
      # 未现）落「未捕获标记」失败路径、进程已死落「退出」失败路径，两路均输出尾部日志。
      - name: Electron 启动冒烟（打包态 .app 拉起）
        if: runner.os == 'macOS'
        run: |
          set -eu
          APP_BIN=$(ls -d dist-electron/mac*/CLWriting.app/Contents/MacOS/CLWriting | head -n1)
          test -x "$APP_BIN" || { echo "::error::未找到打包态可执行体：$APP_BIN"; exit 1; }
          ELECTRON_ENABLE_LOGGING=1 "$APP_BIN" >/tmp/clw-electron-smoke.log 2>&1 &
          PID=$!
          timeout 60 bash -c 'until grep -q "\[CLW_SMOKE\] ready" /tmp/clw-electron-smoke.log 2>/dev/null; do sleep 1; done' || true
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Electron 打包应用在启动标记轮询窗（60s）内退出（启动失败）"
            tail -80 /tmp/clw-electron-smoke.log || true
            exit 1
          fi
          if ! grep -q "\[CLW_SMOKE\] ready" /tmp/clw-electron-smoke.log; then
            echo "::error::冒烟未捕获启动完成标记（[CLW_SMOKE] ready）——进程存活但启动链未走完"
            tail -80 /tmp/clw-electron-smoke.log || true
            exit 1
          fi
          if grep -q "\[CLW_SMOKE\] renderer-crash" /tmp/clw-electron-smoke.log; then
            echo "::error::冒烟期内触发渲染进程崩溃"
            tail -80 /tmp/clw-electron-smoke.log || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          # 复审-0914-优化修复批 P3：TERM 后固定 sleep 3 改轮询进程退出早退（上限 3s
          # 不短于原裕度，提前退出即提前收口）；仍滞留时 KILL 兜底保持不变。
          timeout 3 bash -c 'until ! kill -0 '"$PID"' 2>/dev/null; do sleep 1; done' || true
          kill -9 "$PID" 2>/dev/null || true
          echo "冒烟通过：打包态 Electron 启动标记已捕获、无渲染崩溃标记，TERM 后进程已收口"
      # 复审-0913-mac适配 P3-11：window-cycle（建窗→关窗→退出链）此前只有 ubuntu dev 态
      # 覆盖（scripts/electron-smoke.mjs 缺省 node electron/cli.js 形态），打包态链无 CI
      # 接线。此处以 CLW_SMOKE_APP_BIN 注入实包二进制跑同款驱动——脚本契约（scripts/
      # electron-smoke.mjs）：spawn 该二进制并注 CLW_SMOKE_WINDOW_CYCLE=1（main.ts
      # bootstrap ready 后跑 runSmokeWindowCycle：真实建窗→关窗→白名单摘除校验），60s
      # 有界内观察到 `[CLW_SMOKE] window-cycle-ok` 即 exit 0；crash/fail/timeout/提前
      # 退出均非零。路径与上步同源 glob（mac*/ 容 arch 目录命名差异，勿硬编码 mac-arm64）；
      # test -x 必须保留：glob 落空时 APP_BIN 为空串，脚本对空 CLW_SMOKE_APP_BIN 会静默
      # 降级 dev 态形态（假绿）。放工件上传后（同上步口径：冒烟红仍留 DMG 供排查）。
      - name: Electron 关窗链冒烟（打包态 .app，window-cycle）
        if: runner.os == 'macOS'
        run: |
          set -eu
          APP_BIN=$(ls -d dist-electron/mac*/CLWriting.app/Contents/MacOS/CLWriting | head -n1)
          test -x "$APP_BIN" || { echo "::error::未找到打包态可执行体：$APP_BIN"; exit 1; }
          CLW_SMOKE_APP_BIN="$APP_BIN" npm run smoke:electron
      # 五轮重评修复批（H101）：packaged-app-smoke 接线——此前是零调用方死 spec：env 门
      # CLWRITING_E2E_RELEASE 只有 test:e2e:release 脚本设且 playwright 只点名 release-smoke
      # 单文件（本 spec 不在收集集），全仓零执行方，打包态「fontlist 外置二进制 → spawn →
      # IPC → UI 字体下拉」整链自动化覆盖为零（仅 2026-09-17 mac 实机人工验证在案）。
      # 此处 build:desktop 产物在位后真跑（打包态 UI 动线冒烟本就该在打包后执行；spec
      # 自带产物缺失 fail-closed 断言 + CLWRITING_E2E_APP_BIN 覆盖二进制定位）。同上方
      # 两步口径：放工件上传后，冒烟红仍留 DMG 供排查；APP_BIN 同款 glob（勿硬编码
      # arch 段）+ test -x 防假绿守卫。
      - name: 打包态应用冒烟（packaged-app-smoke，UI 动线 · 字体链）
        if: runner.os == 'macOS'
        run: |
          set -eu
          APP_BIN=$(ls -d dist-electron/mac*/CLWriting.app/Contents/MacOS/CLWriting | head -n1)
          test -x "$APP_BIN" || { echo "::error::未找到打包态可执行体：$APP_BIN"; exit 1; }
          CLWRITING_E2E_RELEASE=1 CLWRITING_E2E_APP_BIN="$APP_BIN" npx playwright test test/e2e/packaged-app-smoke.spec.ts
      # J0：win 腿同款启动冒烟——NSIS 产物不解包，拉起 win-unpacked/ 内可执行体（与 .app
      # 同一次 electron-builder 产物、解包态同口径，非安装器复验）。
      # R74-6（二十二轮）：判定对齐 mac 腿三重判（R73-53 口径——进程存活≠启动链走完）：
      # ①进程存活 ②日志含 [CLW_SMOKE] ready 启动标记 ③无 [CLW_SMOKE] renderer-crash
      # 崩溃标记（标记字符串与 mac 腿同源，均为 main.ts 直写 stdout 的结构化打点）。
      # ELECTRON_ENABLE_LOGGING=1 与 mac 腿同口径；pwsh 的 Start-Process 不允许
      # stdout/stderr 重定向同一文件，分两文件后同查（等价 mac 的 2>&1 合流）。
      # 复审-0914-优化修复批 P3：固定 25s 改轮询启动标记早退（上限 60s ≥ 原 25s 安全
      # 裕度）。判定语义不弱化：下方 HasExited + ready + 无 renderer-crash 三重判定
      # 原样保留——轮询超时（标记未现）落「未捕获标记」失败路径、进程已死落「退出」
      # 失败路径，两路均输出尾部日志。
      - name: Electron 启动冒烟（打包态 exe 拉起）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist-electron/win-unpacked/CLWriting.exe"
          if (-not (Test-Path $exe)) {
            Write-Output "::error::未找到打包态可执行体：$exe"
            exit 1
          }
          $logOut = "clw-electron-smoke.out.log"
          $logErr = "clw-electron-smoke.err.log"
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $logOut -RedirectStandardError $logErr
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Get-Content $logOut, $logErr -ErrorAction SilentlyContinue | Select-String -SimpleMatch "[CLW_SMOKE] ready") -and ((Get-Date) -lt $deadline)) {
            Start-Sleep -Seconds 1
          }
          if ($p.HasExited) {
            Write-Output "::error::Electron 打包应用在启动标记轮询窗（60s）内退出（启动失败，ExitCode=$($p.ExitCode)）"
            Get-Content $logOut -Tail 80 -ErrorAction SilentlyContinue
            Get-Content $logErr -Tail 80 -ErrorAction SilentlyContinue
            exit 1
          }
          $logs = @($logOut, $logErr) | Where-Object { Test-Path $_ }
          if (-not ($logs | Select-String -SimpleMatch "[CLW_SMOKE] ready")) {
            Write-Output "::error::冒烟未捕获启动完成标记（[CLW_SMOKE] ready）——进程存活但启动链未走完"
            $logs | ForEach-Object { Get-Content $_ -Tail 80 }
            exit 1
          }
          if ($logs | Select-String -SimpleMatch "[CLW_SMOKE] renderer-crash") {
            Write-Output "::error::冒烟期内触发渲染进程崩溃"
            $logs | ForEach-Object { Get-Content $_ -Tail 80 }
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Output "冒烟通过：打包态 Electron 启动标记已捕获，无渲染崩溃标记"
      # 重评-0914-三轮 P3-5：win 腿补关窗链冒烟——mac 腿（复审-0913-mac适配 P3-11）已以
      # CLW_SMOKE_APP_BIN 注入打包态二进制跑 scripts/electron-smoke.mjs 的 window-cycle
      # 驱动，脚本的 win 支持（taskkill /T 杀树 + 打包态直起二进制分支）早已在位但从未
      # 接线，win 打包态「真实建窗→关窗→白名单摘除」链此前无任何 CI 兜底。形态复刻 mac
      # 腿两行（定位产物 + 可执行体守卫 + env 注入）；win 产物无 mac 的 arch 可变段
      #（win-unpacked/ 固定，与上方启动冒烟腿同一路径口径），Get-Item 落空返回 $null。
      # 守卫必须保留：appBin 为空串时脚本对空 CLW_SMOKE_APP_BIN 会静默降级 dev 态形态
      # （假绿，同 mac 腿 test -x 的防假绿语义）。放工件上传后（同 mac 口径：冒烟红
      # 仍留 exe 工件供排查）。
      - name: Electron 关窗链冒烟（打包态 exe，window-cycle）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-Item "dist-electron/win-unpacked/CLWriting.exe" -ErrorAction SilentlyContinue).FullName
          if (-not $exe) {
            Write-Output "::error::未找到打包态可执行体：dist-electron/win-unpacked/CLWriting.exe"
            exit 1
          }
          $env:CLW_SMOKE_APP_BIN = $exe
          npm run smoke:electron
