name: CI

on:
  # W-P2-14：恢复自动触发（发布门不再名存实亡）。分支限 main/dev + 指向 main 的 PR，避免特性分支频繁跑。
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # G4-1（2026-08-16）：typecheck/单测扩 ubuntu；e2e 与桌面构建仍仅 mac（Electron 面）。
        os: [ubuntu-latest, macos-latest]
        # 24=LTS / 26=Current（25 奇数线已 EOL）。engines >=24；node:sqlite 自 v23.4.0 起免 flag，两版均零 flag 可用。
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 装依赖
        run: npm ci

      - name: 装前端依赖（web-next node_modules）
        run: npm --prefix src/studio/web-next ci

      - name: 类型检查（tsc --noEmit 零错）
        run: npm run typecheck

      - name: 前端类型检查（vue-tsc）
        run: npm --prefix src/studio/web-next run typecheck

      - name: 构建（src + web-next → dist，发布资产门）
        run: npm run build:all

      - name: 发布产物门（dist/web/index.html + package.main 必须存在）
        run: node -e "const fs=require('fs');const p=require('./package.json');for(const f of ['dist/web/index.html',p.main]){if(!fs.existsSync(f)){console.error(f+' 缺失,发布包不完整');process.exit(1)}}"

      - name: 测试（含 node:sqlite smoke）
        run: npm test

      # X-P2-16：README 数字对账门——「账实对照」从自律升级为门禁，失配即红
      - name: README 数字对账（check:counts）
        run: npm run check:counts

      # W-P2-14：删三死步——test:rc-path 脚本已不存在；dist/cli.js 无此产物（tsup 只出 dist/desktop/*，
      # 已并入上方发布产物门查 package.main）；「零第三方依赖断言」与 dependencies 3 项矛盾。

  # e2e job（M11 E1 恢复）：playwright 跑 web-next 动线 e2e（test/e2e/，release-smoke 另走 test:e2e:release），独立 job 不阻塞 build-test。
  e2e:
    name: e2e · playwright
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 装依赖
        run: npm ci

      - name: 装前端依赖（web-next node_modules）
        run: npm --prefix src/studio/web-next ci

      - name: 装 playwright chromium
        run: npx playwright install chromium

      - name: 跑 e2e（build:web + playwright test）
        run: npm run test:e2e

      - name: 上传 trace（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
