name: CI

on:
  # W-P2-14：恢复自动触发（发布门不再名存实亡）。分支限 main/dev + 指向 main 的 PR，避免特性分支频繁跑。
  # 2026-08-28 两步收窄：先摘 dev push 腿（频推期全矩阵逐推跑过重），本条改全手动——
  # push/PR 自动触发全部摘除，CI 只走 workflow_dispatch 手动跑。验证责任回到本地
  # npm test（合入门槛不变）；频推期结束后恢复 push 腿（main，或 main+dev）。
  workflow_dispatch:

# R72-13（二十轮 H-4）：并发组 + 最小权限——同 ref 新跑取消未完成旧跑（PR 连推连取消，
# push 腿不取消防长跑被抖动反复杀）；GITHUB_TOKEN 收敛只读（本工作流只
# checkout/build/upload，无发布面写操作；upload-artifact 走运行时独立 token 不受影响）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # R66-39（十四轮）：10 分钟无数据背书偏紧——慢机偶发超时以超时红呈现（报告 §五）。
    # 放宽到 20（≈2× 余量）作过渡值，待 CI 实跑时长数据回填后再校准。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # G4-1（2026-08-16）：typecheck/单测扩 ubuntu；e2e 已迁 ubuntu（R66-38），
        # mac 腿保留验证 Electron 相关面（devDependencies 二进制/tsup 桌面产物构建）。
        # R69-6（十七轮，= 阶段 21 J4）：补 windows-latest 腿（仅 Node 24 控成本）——
        # 按 win 适配 D4 拍板口径「win 仅 typecheck+build+单测（e2e 仍 mac/ubuntu）」：
        # 本 job 其余步（lint/packaging/counts/knowledge/pack）纯 Node 脚本顺带背书。
        # 45 处 skipIf(win32) 平台守卫 + R69-7 补的 3 文件已就位；win npm ci/构建较慢，
        # 20 分钟超时为首跑观察值（J0 打包前以本腿为 win 持续门）。
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 24=LTS / 26=Current（25 奇数线已 EOL）。engines >=24；node:sqlite 自 v23.4.0 起免 flag，两版均零 flag 可用。
        node: [24, 26]
        exclude:
          - os: windows-latest
            node: 26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # dd-P3（E-P3-2）：npm 缓存——两条 lockfile 都入键，web-next 单独升级依赖也能正确失效
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/studio/web-next/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 装前端依赖（web-next node_modules）
        run: npm --prefix src/studio/web-next ci

      - name: 类型检查（tsc --noEmit 零错）
        run: npm run typecheck

      - name: 前端类型检查（vue-tsc）
        run: npm --prefix src/studio/web-next run typecheck

      # R67-3（十五轮）：lint 门接线——package.json 的 lint 脚本此前只在本地跑，
      # ci.yml 全文无 lint 步骤，与 coverage 门「只在本地生效」同款名存实亡判例。
      # 当前 eslint.config.js 射程仅 3 个 JS 文件（TS/Vue 扩射程另立账），步绿门在先。
      - name: lint 门（eslint）
        run: npm run lint

      - name: 构建（src + web-next → dist，发布资产门）
        run: npm run build:all

      - name: 发布产物门（dist/web/index.html + package.main 必须存在）
        run: node -e "const fs=require('fs');const p=require('./package.json');for(const f of ['dist/web/index.html',p.main]){if(!fs.existsSync(f)){console.error(f+' 缺失,发布包不完整');process.exit(1)}}"

      # CC-P1-7：打包资源门——resources/ 缺席打包清单时打包态 AI 链路必挂（dev 形态测不出）
      - name: 打包资源门（check:packaging）
        run: npm run check:packaging

      # 复评P2：npm 包清单实跑门——本机 Node 25/npm 11 pack 无具体错误退出 1 悬而未决，
      # 在发布底座 Node 24 上以退出码实证 files 清单可打包（dry-run 不产 tarball）
      - name: npm pack 清单门（Node 24）
        if: matrix.node == 24
        run: npm pack --dry-run

      # dd-P2（E-P2-1）：覆盖率阈值门接线——vitest.config 的 thresholds（语句/分支/函数/行）
      # 此前只在本地 test:coverage 生效，CI 从不跑 → 门名存实亡。单腿跑覆盖（v8 插桩有开销），
      # 其余腿维持纯 npm test；coverage run 本身执行全部用例，不额外重复跑。
      - name: 测试（含 node:sqlite smoke）
        run: npm test
        # 注意须 ${{ }} 包裹：裸 if 以 ! 开头会被 YAML 解析为标签（gg批0：CI 工作流启动级失败的根因）
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
      - name: 测试 + 覆盖率阈值门（ubuntu·24 腿）
        run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24

      # R72-14（二十轮 H-11）：coverage 腿报告工件化——阈值红时 html/json-summary 有现场
      # 可查（此前只跑门不留档，复现只能在本地另跑）
      - name: 上传覆盖率报告（ubuntu·24 腿）
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # X-P2-16：README 数字对账门——「账实对照」从自律升级为门禁，失配即红
      - name: README 数字对账（check:counts）
        run: npm run check:counts

      # P2-29：知识层 manifest 对账门——「CI 只相信正式知识层」从注释升级为门禁
      #（知识层/_manifest.json 与实际文件任一失配即红，改素材漏登记/漏更新不再静默）
      - name: 知识层 manifest 对账（check:knowledge）
        run: npm run check:knowledge

      # W-P2-14：删三死步——test:rc-path 脚本已不存在；dist/cli.js 无此产物（tsup 只出 dist/desktop/*，
      # 已并入上方发布产物门查 package.main）；「零第三方依赖断言」与 dependencies 3 项矛盾。

  # e2e job（M11 E1 恢复）：playwright 跑 web-next 动线 e2e（test/e2e/，release-smoke 另走 test:e2e:release），独立 job 不阻塞 build-test。
  e2e:
    name: e2e · playwright
    # R66-38（十四轮）：mac → ubuntu——本 job 全链只碰 chromium + Node HTTP（globalSetup 起
    # studio server、release-smoke 起编译产物 server-main.js，均不启动 Electron 壳），
    # 「Electron 面须 mac」的理由不成立；macos runner 计费 10× 于 linux，纯惯例性浪费。
    runs-on: ubuntu-latest
    # R66-39（十四轮）：与 build-test 同款放宽——build:all + 29 spec 串行（workers:1）+
    # release-smoke 二次构建，10 分钟慢机易触顶。20 为过渡值，待实跑数据校准。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/studio/web-next/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 装前端依赖（web-next node_modules）
        run: npm --prefix src/studio/web-next ci

      # --with-deps：ubuntu 上确保 chromium 系统库齐备（runner 镜像通常预装，此处幂等兜底）
      - name: 装 playwright chromium
        run: npx playwright install --with-deps chromium

      - name: 跑 e2e（build:web + playwright test）
        run: npm run test:e2e

      # dd-P2（E-P2-3）：发布冒烟接线——dist/desktop/server-main.js 起真实编译产物验证
      # （此前仅本地手跑，CI 从不验发布形态；打包资源门只查文件存在不验可启动）
      - name: 发布冒烟（release-smoke，build:all + 编译产物起服）
        run: npm run test:e2e:release

      - name: 上传 trace（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
