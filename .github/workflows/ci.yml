name: CI

on:
  # W-P2-14：恢复自动触发（发布门不再名存实亡）。分支限 main/dev + 指向 main 的 PR，避免特性分支频繁跑。
  # 2026-08-28 两步收窄：先摘 dev push 腿（频推期全矩阵逐推跑过重），再摘 PR 腿改全手动
  # （CI 一度只走 workflow_dispatch，验证责任回到本地 npm test，合入门槛不变）。
  # 2026-08-29 R74-5：恢复指向 main 的 PR 腿（自动门恢复最小面——合入门重新自动跑）。
  # R49-36：补回 push main 腿——上一行挂账的「push 腿频推期结束后恢复」至此兑现，
  # main 直推恢复全矩阵背书。push（refs/heads/main）与 PR（refs/pull/*/merge）ref 不同，
  # concurrency 组互不相扰；组内语义两触发各自成立（PR 连推连取消，push 腿不取消，见下）。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# R72-13（二十轮 H-4）：并发组 + 最小权限——同 ref 新跑取消未完成旧跑（PR 连推连取消，
# push 腿不取消防长跑被抖动反复杀）；GITHUB_TOKEN 收敛只读（本工作流只
# checkout/build/upload，无发布面写操作；upload-artifact 走运行时独立 token 不受影响）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # R66-39（十四轮）：10 分钟无数据背书偏紧——慢机偶发超时以超时红呈现（报告 §五）。
    # 放宽到 20（≈2× 余量）作过渡值，待 CI 实跑时长数据回填后再校准。
    # F-7（二十九轮批 F）：20→30——job 级超时为全矩阵共享，win 腿（npm ci ×2 +
    # build:all + 全量单测）在 20 分钟预算上易触顶假红，取最慢腿背书放宽。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # G4-1（2026-08-16）：typecheck/单测扩 ubuntu；e2e 已迁 ubuntu（R66-38），
        # mac 腿保留验证 Electron 相关面（devDependencies 二进制/tsup 桌面产物构建）。
        # R69-6（十七轮，= 阶段 21 J4）：补 windows-latest 腿（仅 Node 24 控成本）——
        # 按 win 适配 D4 拍板口径「win 仅 typecheck+build+单测（e2e 仍 mac/ubuntu）」：
        # 本 job 其余步（lint/packaging/counts/knowledge/pack）纯 Node 脚本顺带背书。
        # 重评-35（全库代码重评审 2026-09-05）：win 平台守卫 skipIf(win32) 家族随测试批
        # 演进增减，数量以全库实测为准，勿在注释钉值（旧注释钉「45 处」已账实漂移）；
        # win npm ci/构建较慢，20 分钟超时为首跑观察值（J0 打包前以本腿为 win 持续门），F-7 已放宽到 30。
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 24=LTS / 26=Current（25 奇数线已 EOL）。engines >=24；node:sqlite 自 v23.4.0 起免 flag，两版均零 flag 可用。
        node: [24, 26]
        exclude:
          - os: windows-latest
            node: 26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # dd-P3（E-P3-2）：npm 缓存——两条 lockfile 都入键，web-next 单独升级依赖也能正确失效
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/studio/web-next/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 装前端依赖（web-next node_modules）
        run: npm --prefix src/studio/web-next ci

      - name: 类型检查（tsc --noEmit 零错）
        run: npm run typecheck

      - name: 前端类型检查（vue-tsc）
        run: npm --prefix src/studio/web-next run typecheck

      # R67-3（十五轮）：lint 门接线——package.json 的 lint 脚本此前只在本地跑，
      # ci.yml 全文无 lint 步骤，与 coverage 门「只在本地生效」同款名存实亡判例。
      # 射程现状（R9-P2-5 修账）：JS 块 + src/scripts/test/*.config.ts 的 TS 块；
      # .vue 未纳入（另立账）。步绿门在先。
      - name: lint 门（eslint）
        run: npm run lint

      - name: 构建（src + web-next → dist，发布资产门）
        run: npm run build:all

      - name: 发布产物门（dist/web/index.html + package.main 必须存在）
        run: node -e "const fs=require('fs');const p=require('./package.json');for(const f of ['dist/web/index.html',p.main]){if(!fs.existsSync(f)){console.error(f+' 缺失,发布包不完整');process.exit(1)}}"

      # CC-P1-7：打包资源门——resources/ 缺席打包清单时打包态 AI 链路必挂（dev 形态测不出）
      - name: 打包资源门（check:packaging）
        run: npm run check:packaging

      # 复评P2：npm 包清单实跑门——本机 Node 25/npm 11 pack 无具体错误退出 1 悬而未决，
      # 在发布底座 Node 24 上以退出码实证 files 清单可打包（dry-run 不产 tarball）
      # R40-49（四十轮）：--ignore-scripts 复用本 job 上方「构建（build:all）」产物——
      # package.json 的 prepack=build:all，pack 默认生命周期钩子会把同 job 已建产物整轮
      # 重复构建（CI 时长浪费，无正确性影响）。清单门只验 files 清单与产物在位；产物由
      # 同 job 同命令（build:all）产出，门语义不变，不改 job 依赖/矩阵
      - name: npm pack 清单门（Node 24）
        if: matrix.node == 24
        run: npm pack --dry-run --ignore-scripts

      # dd-P2（E-P2-1）：覆盖率阈值门接线——vitest.config 的 thresholds（语句/分支/函数/行）
      # 此前只在本地 test:coverage 生效，CI 从不跑 → 门名存实亡。单腿跑覆盖（v8 插桩有开销），
      # 其余腿维持纯 npm test；coverage run 本身执行全部用例，不额外重复跑。
      - name: 测试（含 node:sqlite smoke）
        run: npm test
        # 注意须 ${{ }} 包裹：裸 if 以 ! 开头会被 YAML 解析为标签（gg批0：CI 工作流启动级失败的根因）
        # R0911-G-P1-1d：win 腿拆到下方专用步（收尾竞态重跑兜底），其余非覆盖腿维持原样
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) && matrix.os != 'windows-latest' }}
      # R0911-G-P1-1d（2026-09-11 CI 红族之四）：win 腿测试步「同命令重跑一次」兜底。
      # 成因定性（源码证据，见台账 §三 G 族）：win 腿用例零红，但 vitest forks 池默认
      # isolate=true——每个测试文件跑完都销毁一个 fork worker（tinypool ProcessWorker：
      # teardown 消息 → 等 worker 应答 → kill）；win 上 TerminateProcess 即时生效 + IPC
      # 通道关断时序差异，收尾期「teardown 应答 vs kill」竞态窗内 process.send() 抛
      # ERR_IPC_CHANNEL_CLOSED，tinypool 1.1.1 的 ThreadPool.destroy 对 _removeWorker
      # 返回的 promise 无 catch → unhandledRejection → vitest 主进程
      # registerUnhandledRejection 一律 process.exit(1)（汇总打印前被杀，2026-09-08
      # win 红同族，间歇性竞态）。
      # 重跑语义：首跑绿 = 零额外成本；首跑红 → 同命令重跑一次：重跑绿 = 收尾竞态洗白
      # （win 用例本身全绿的既证形态）；重跑仍红 = exit 1 步红——真失败不吞，只延后一轮。
      # 副作用已知：①真用例红多花一次全量时长（win 腿预算 30min，实测测试段 ~6min 可容）；
      # ②间歇用例 flake 可能被重跑洗白一跑——当前 win 腿零用例红，风险面收窄接受。
      # ubuntu/macos 腿无此竞态族记录，不加重试（保持失败首报的排障效率）。
      # 待上游根治后（vitest/tinypool 升级，见台账登记项）本兜底可撤。
      - name: 测试（win 腿，R0911-G-P1-1d 收尾竞态重跑一次兜底）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning title=R0911-G-P1-1d::win 腿测试首跑非零退出（tinypool teardown ERR_IPC_CHANNEL_CLOSED 收尾竞态嫌疑）——同命令重跑一次区分收尾竞态与真失败"
            npm test
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          exit 0
      - name: 测试 + 覆盖率阈值门（ubuntu·24 腿）
        run: npm run test:coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24

      # R72-14（二十轮 H-11）：coverage 腿报告工件化——阈值红时 html/json-summary 有现场
      # 可查（此前只跑门不留档，复现只能在本地另跑）
      # R44-4（四十四轮）：补 always()——隐式 success() 使工件恰在阈值红（其设计场景）
      # 时不传，与注释宣称相反；同文件 playwright trace 的 if: failure() / desktop.yml
      # 的 if: always() && … 为仓内正确先例。vitest.config 已同步补 reportOnFailure: true
      #（用例红形态下 coverage/ 目录也要产出，见 R44-4 注记）。
      - name: 上传覆盖率报告（ubuntu·24 腿）
        if: ${{ always() && matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # X-P2-16：README 数字对账门——「账实对照」从自律升级为门禁，失配即红
      - name: README 数字对账（check:counts）
        run: npm run check:counts

      # P2-29：知识层 manifest 对账门——「CI 只相信正式知识层」从注释升级为门禁
      #（知识层/_manifest.json 与实际文件任一失配即红，改素材漏登记/漏更新不再静默）
      - name: 知识层 manifest 对账（check:knowledge）
        run: npm run check:knowledge

      # W-P2-14：删三死步——test:rc-path 脚本已不存在；dist/cli.js 无此产物（tsup 只出 dist/desktop/*，
      # 已并入上方发布产物门查 package.main）；「零第三方依赖断言」与 dependencies 3 项矛盾。

  # e2e job（M11 E1 恢复）：playwright 跑 web-next 动线 e2e（test/e2e/，release-smoke 另走 test:e2e:release），独立 job 不阻塞 build-test。
  e2e:
    name: e2e · playwright
    # R66-38（十四轮）：mac → ubuntu——本 job 全链只碰 chromium + Node HTTP（globalSetup 起
    # studio server、release-smoke 起编译产物 server-main.js，均不启动 Electron 壳），
    # 「Electron 面须 mac」的理由不成立；macos runner 计费 10× 于 linux，纯惯例性浪费。
    runs-on: ubuntu-latest
    # R66-39（十四轮）：与 build-test 同款放宽——build:all + 29 spec 串行（workers:1）+
    # release-smoke 二次构建，10 分钟慢机易触顶。20 为过渡值，待实跑数据校准。
    # R0910-W（2026-09-10）：20→25——本轮补 Electron 集成冒烟（apt 装系统依赖 + xvfb 起
    # 真壳）与 soak 步，release-smoke 的 build:all 之上再叠 ~1-2 分钟，取 25 留余量。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/studio/web-next/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 装前端依赖（web-next node_modules）
        run: npm --prefix src/studio/web-next ci

      # --with-deps：ubuntu 上确保 chromium 系统库齐备（runner 镜像通常预装，此处幂等兜底）
      # R0911-G-P3-5（2026-09-11 全量重评 GLM-5.3 修复批）：浏览器层缓存——每跑重下
      # chromium ~130MB，按根 lockfile 哈希键控（@playwright/test 版本变更自动失效重下；
      # --with-deps 的 apt 侧幂等，命中缓存时 install 秒级 no-op）
      - name: 缓存 playwright chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 装 playwright chromium
        run: npx playwright install --with-deps chromium

      - name: 跑 e2e（build:web + playwright test）
        run: npm run test:e2e

      # dd-P2（E-P2-3）：发布冒烟接线——dist/desktop/server-main.js 起真实编译产物验证
      # （此前仅本地手跑，CI 从不验发布形态；打包资源门只查文件存在不验可启动）
      - name: 发布冒烟（release-smoke，build:all + 编译产物起服）
        run: npm run test:e2e:release

      # R0910-W（2026-09-10）：Electron 集成冒烟接入 PR/push 门——此前本 job 全链只碰
      # chromium + Node HTTP（mock driver），从不启动 Electron 壳；唯一 Electron 覆盖
      # 是 desktop.yml 的 25s 存活冒烟（仅 tag 推送触发）。真实崩溃（src/desktop/main.ts
      # 的 closed 清理监听在销毁态 webContents 上抛错 → 关窗链短路/退出异常）因此可随 PR
      # 合入。本步以 CLW_SMOKE_WINDOW_CYCLE=1 驱动真实建窗→关窗→标记（契约见 main.ts），
      # 不依赖 studio server 就绪；dist 由上一「发布冒烟」步的 build:all 产出。
      # 系统库逐个容错安装：22.04→24.04 间 libgtk-3/libasound2 有 t64 更名，候选名任一
      # 装成即过；装后显式核对（xvfb-run / GTK / NSS 至少各一在位），缺则 fail-fast 报人话，
      # 不把「库没装齐」伪装成后续冒烟超时。
      - name: 装 Electron 系统依赖（xvfb + GTK/NSS/ALSA）
        run: |
          sudo apt-get update
          for p in xvfb libgtk-3-0 libgtk-3-0t64 libnss3 libgbm1 libxss1 libasound2 libasound2t64; do
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "$p" || true
          done
          command -v xvfb-run >/dev/null || { echo "::error::xvfb 未安装成功"; exit 1; }
          ldconfig -p | grep -q 'libgtk-3' || { echo "::error::libgtk-3 未安装成功"; exit 1; }
          ldconfig -p | grep -q 'libnss3' || { echo "::error::libnss3 未安装成功"; exit 1; }
          # R0911-G-P3-6（2026-09-11 全量重评 GLM-5.3 修复批）：核对面补齐 libgbm/libasound
          # ——apt 循环 `|| true` 容错安装时装失败此前静默（装 7 包只核对 3），Electron
          # 缺 GPU/ALSA 库以非零退/挂死收场，伪装成后面冒烟步的超时红，指因错层。
          ldconfig -p | grep -q 'libgbm' || { echo "::error::libgbm 未安装成功（Electron GPU 合成必需）"; exit 1; }
          ldconfig -p | grep -q 'libasound' || { echo "::error::libasound 未安装成功（Electron 音频栈必需）"; exit 1; }

      - name: Electron 集成冒烟（真实建窗→关窗，xvfb）
        run: xvfb-run -a npm run smoke:electron

      # R0910-W（2026-09-10）：有界 soak/泄漏门——「200 万字不崩」此前全仓无内存断言
      #（grep memoryUsage|heapUsed = 0 命中），线性泄漏回归无门可拦。独立脚本
      #（test/soak/soak.ts，故意不带 .test. 以不进 README 计数套件）反复跑有界纯路径 +
      # --expose-gc 断增长上界（详见脚本头注）；gc 不可用则干净 SKIP。无系统依赖，纯 Node。
      - name: 有界内存/soak 门（--expose-gc）
        run: npm run soak

      - name: 上传 trace（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
