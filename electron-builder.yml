# Electron 桌面打包配置（#electron）
appId: com.clwriting.studio
productName: CLWriting
directories:
  output: dist-electron
# asar 内容：主进程 + chunks + 前端 + 捆绑资源（CC-P1-7：resources/ 缺席时打包态
# resourcesRoot() 必抛错——内置 prompt/技巧包全在 asar 根 resources/ 下，
# 与 dist/desktop/main.js 的「上两级」推导正好对齐，Electron asar fs 补丁可直读）
files:
  - dist/**/*
  - resources/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  target:
    - dmg
  # MP2-5 + R38-3（三十八轮修复批）：mac 侧 `identity: "-"` = 真 ad-hoc 签名——上游
  # app-builder-lib 语义：`identity: null` 走 handleNullIdentity() **完全跳过签名**
  #（MP2-5 原注释「null = ad-hoc」系误读，三十八轮经上游源码 + 实包 codesign 核实：
  # 跳签产物 Sealed Resources=none、spctl 拒、Gatekeeper「已损坏」概率大增）；`"-"`
  # 走 IdentityClass("-") 密封路径，无证书环境本地构建必成、行为确定。分发 Gatekeeper
  # 「无法验证开发者」提示与右键打开指引见根 README「macOS 版使用须知」。正式签名/
  # 公证（Developer ID + notarytool）留待作者购证后启用。
  identity: "-"
  # D2（2026-08-23 拍板，阶段 21 J0 落地）：图标本轮补全——build/icon.png 512×512 单真相源
  # （「笔+书」中文风，作者实物验收制）；ico/icns 由 electron-builder（app-builder）从 png
  # 自动派生，icns 不必手做。二十轮 H-1「仓内零图标/不代选」口径随之废止。
  icon: build/icon.png
# win 已启用（阶段 21 J0，2026-08-28；D1 仅 NSIS / D3 x64 先行 / 首版 unsigned 披露见 D4）；
# linux 仍暂缓（2026-06-30 决策不变，恢复时取消注释）
# R77-4（二十五轮批 F，J6 落账）：首版 unsigned 维持——SmartScreen「更多信息→仍要运行」
# 与无自动更新（覆盖安装）指引在根 README「Windows 版使用须知」。长路径对策复核收口：
# electron-builder 无 longPathAware 字段（app-builder-lib schema 零命中，2026-08-30），
# Node/libuv 对绝对路径自动 \\?\ 前缀已绕 MAX_PATH（test/fs/long-path-smoke.test.ts 冒烟），
# 披露口径 = 书库路径建议 <200 字符。
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
