# Electron 桌面打包配置（#electron）
appId: com.clwriting.studio
productName: CLWriting
directories:
  output: dist-electron
# asar 内容：主进程 + chunks + 前端 + 捆绑资源（CC-P1-7：resources/ 缺席时打包态
# resourcesRoot() 必抛错——内置 prompt/技巧包全在 asar 根 resources/ 下，
# 与 dist/desktop/main.js 的「上两级」推导正好对齐，Electron asar fs 补丁可直读）
# 全库重评-0914（P3-10）：补 AppleDouble 否定模式——外置/网络构建卷上 macOS 会为每个
# 文件生成 ._ 伴生文件（资源叉），白名单 `dist/**/*` 通配把它们一并打进 asar（体积
# 膨胀 + 打包态读到垃圾伴生）；引号防 YAML 把开头 ! 当 tag 解析。排除项由
# check-packaging.mjs 的 problemsForElectronBuilderAppleDouble 锚定（防回潮）。
files:
  - dist/**/*
  - resources/**/*
  - package.json
  - '!**/._*'
  # 0917清库修复批：排 electron-builder 自动收编的生产依赖 node_modules——本仓 tsup
  # 全量 bundle（external 仅 electron），运行时零裸包解析（dist 产物只 import node:*），
  # @anthropic-ai/sdk / openai / font-list 三依赖已内联进 chunk、fontlist 二进制走
  # dist/desktop/fontlist + asarUnpack；node_modules 照收只会白占 asar 体积。
  # 排除经 files 否定模式透传 node_modules 收集器（app-builder-lib 只取 files 的 ! 项）。
  - '!node_modules/**'
asar: true
# R0911-A-P2-1（2026-09-11 全量重评 GLM-5.3 修复批）：mac fontlist 原生二进制外置——
# main 进程的自管枚举（font-cache.ts runFontListCommandWithKill）用 spawn，spawn 不认
# asar 内路径（execFile 有 Electron 补丁、spawn 没有），desktop/fontlist（tsup onSuccess
# 构建期拷入 dist，darwin 腿）须外置到 app.asar.unpacked/ 同相对位，main.ts
# darwinFontListCommand 按 asar→asar.unpacked 改写取真路径。win/linux 腿 dist 内无此
# 文件，glob 零命中为 no-op。
# R0912（mac 线重评-0911c P2）/ R0912-A-P2-1（win 线 2026-09-12 独立重评 GLM-5.3 修复批）
# 同题并合：上批模式 `desktop/fontlist` 不匹配 asar 内实际路径 `dist/desktop/fontlist`——
# files 规则 `dist/**/*` 打包后 asar 内资源路径带 dist/ 段（app-builder-lib FileMatcher
# 以 appDir 相对路径做 minimatch，对无 `**/` 前缀模式不隐式加根），裸 `desktop/fontlist`
# 零命中 = 外置 no-op，打包态 darwinFontListCommand 恒 ENOENT 回落、超时必杀加固失效。
# 两边各自独立实证（mac 线 `electron-builder --dir` 实包核验 unpacked 内无
# dist/desktop/fontlist；win 线 Minimatch 9.0.9 比对）。定为显式 `dist/desktop/fontlist`
# （运行时 darwinFontListCommand 改写期望 app.asar.unpacked/dist/desktop/fontlist，与
# test/desktop/r0911-font-binary-path 同口径）；门（check-packaging.mjs）同步校验模式
# 可命中，旧错误形态判红。
asarUnpack:
  - dist/desktop/fontlist
mac:
  category: public.app-category.productivity
  # 阶段 49（发行平台覆盖批，随作者指令「mac 需要兼容之前的 mac 硬件」）：双 arch 出包
  # ——arm64（Apple Silicon M 系）+ x64（Intel）各一 dmg，H-2「发行架构属发行决策不代拍」
  # 的记档至此由作者拍板落定。交叉出包（arm64 runner 上产 x64）为 electron-builder 标准
  # 路径（另拉 x64 Electron 发行件重打）；ad-hoc identity "-" 对两 arch 均走密封路径。
  # fontlist 原生二进制为 FAT universal（x64+arm64 双切片同文件，tsup 拷入不变），双 arch
  # 包共用无碍——Intel mac 字体快路径照常可达。系统下限随 Electron 44（Chromium 152）=
  # macOS 13 Ventura（Intel 侧即 2017 年及以后机型），更旧硬件受 Chromium 支持策略限制
  # 不可运行（根 README macOS 须知披露）。注：Electron 42 发行件 plist 实为
  # LSMinimumSystemVersion 12.0，44 起才真正钉到 13——本行口径随 44 升级批成立。
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # MP2-5 + R38-3（三十八轮修复批）：mac 侧 `identity: "-"` = 真 ad-hoc 签名——上游
  # app-builder-lib 语义：`identity: null` 走 handleNullIdentity() **完全跳过签名**
  #（MP2-5 原注释「null = ad-hoc」系误读，三十八轮经上游源码 + 实包 codesign 核实：
  # 跳签产物 Sealed Resources=none、spctl 拒、Gatekeeper「已损坏」概率大增）；`"-"`
  # 走 IdentityClass("-") 密封路径，无证书环境本地构建必成、行为确定。分发 Gatekeeper
  # 「无法验证开发者」提示与右键打开指引见根 README「macOS 版使用须知」。正式签名/
  # 公证（Developer ID + notarytool）留待作者购证后启用。
  identity: "-"
  # D2（2026-08-23 拍板，阶段 21 J0 落地）：图标本轮补全——build/icon.png 512×512 单真相源
  # （「笔+书」中文风，作者实物验收制）；ico/icns 由 electron-builder（app-builder）从 png
  # 自动派生，icns 不必手做。二十轮 H-1「仓内零图标/不代选」口径随之废止。
  icon: build/icon.png
  # 复审-0913-mac适配 P3-9：产物命名与 win 同式对齐（显式钉死——双 arch 两产物靠 ${arch}
  # 段区分，不同名相撞；阶段 49 双 arch 落地后即 arm64/x64 两 dmg 各此形态）。
  artifactName: ${productName}-${version}-${arch}.${ext}
# win 已启用（阶段 21 J0，2026-08-28；D1 仅 NSIS / D3 x64 先行 / 首版 unsigned 披露见 D4）；
# linux 仍暂缓（2026-06-30 决策不变，恢复时取消注释）
# 阶段 47（发版链批，随作者指令「win 做成便携版，不需要安装包」）：win 停发 NSIS 安装包，
# 改便携 zip——免安装、解压到任意目录即用（zip target 打包的就是 win-unpacked/ 目录，
# 与 build:desktop:dir 产物同构；恢复安装包 = target 改回 nsis，沿革见 git 历史）。
# win-unpacked/ 仍是 electron-builder 打包中间产物照常落盘，desktop.yml 两步打包态冒烟
# 取该目录可执行体不受 target 换 zip 影响；exe 图标/版本资源在 unpacked 构建期经 rcedit
# 写入，zip 产物内的 exe 照常带图标。
# R77-4（二十五轮批 F，J6 落账）：首版 unsigned 维持——SmartScreen「更多信息→仍要运行」
# （zip 经资源管理器解压会继承下载标记，首次运行仍可能触发）与无自动更新（解压覆盖）
# 指引在根 README「Windows 版使用须知」。长路径对策复核收口：
# electron-builder 无 longPathAware 字段（app-builder-lib schema 零命中，2026-08-30），
# Node/libuv 对绝对路径自动 \\?\ 前缀已绕 MAX_PATH（test/fs/long-path-smoke.test.ts 冒烟），
# 披露口径 = 书库路径建议 <200 字符。
win:
  target:
    - target: zip
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
# linux:
#   target:
